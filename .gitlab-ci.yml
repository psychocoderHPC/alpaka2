.base:
  variables:
    APCI_ALPAKA_ROOT: "$CI_PROJECT_DIR"
    APCI_RUN_CTEST: "ON"
    APCI_EXEC_CPU_SERIAL: "OFF"
    APCI_HWLOC: "ON"
    APCI_HIP : 0
    APCI_CUDA : 0
    APCI_ONEAPI : 0
    APCI_ONEAPI_TARGET: none
    APCI_TBB : "OFF"
    APCI_SANITIZER_ASAN : "OFF"
    APCI_SANITIZER_TSAN : "OFF"
    APCI_SANITIZER_LSAN : "OFF"
    APCI_SANITIZER_UBSAN : "OFF"
    APCI_SIMD : "DEFAULT"
  script:
    - $APCI_ALPAKA_ROOT/script/ci/job_info.sh
    - $APCI_ALPAKA_ROOT/script/ci/install_dependencies.sh
    - $APCI_ALPAKA_ROOT/script/ci/configure.sh
    - $APCI_ALPAKA_ROOT/script/ci/build.sh
    - $APCI_ALPAKA_ROOT/script/ci/test.sh
  interruptible: true
  tags:
  - x86_64
  - cpuonly

.hip:
  extends: .base
  tags:
    - x86_64
    - rocm

.cuda:
  extends: .base
  image: ubuntu:24.04
  variables:
    APCI_CMAKE: 3.28.3
  tags:
  - x86_64
  - cuda

