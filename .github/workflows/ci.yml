name: CI Build and Test

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

# Stop CI for the PR if the PR is updates.
# Stop CI runs for dev branch if a new PR is merged into the dev branch.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref) }}
  cancel-in-progress: true

env:
  alpaka_cmake_flags: "-Dalpaka_COMPILE_PEDANTIC=ON -Dalpaka_DOCS=ON -Dalpaka_TESTS=ON -Dalpaka_BENCHMARKS=ON -Dalpaka_EXAMPLES=ON -DBUILD_TESTING=ON -Dalpaka_HEADERCHECKS=ON -Dalpaka_LOG=dynamic -Dalpaka_FAST_MATH=OFF"
  APCI_ALPAKA_ROOT: ${{ github.workspace }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip install pre-commit==4.3.0
          pre-commit install
          pre-commit run --all-files --show-diff-on-failure

  ci:
    # Default runner for non-CUDA/HIP tests; overridden for CUDA/HIP
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config:
          - { compiler: gcc, version: "12", cuda: "no", hip: "no", container: "ubuntu:24.04",
              env : {APCI_DEVICE_COMPILER : gcc@12, APCI_CMAKE : 3.28.3, APCI_RUN_CTEST: ON} }
      fail-fast: false

    # Specify the container to use based on the matrix configuration
    container:
      image: ${{ matrix.config.container }}

    env: ${{ matrix.config.env }}

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v6
      - name: export GitHub Actions variables to environment variables
        run: |
            echo "APCI_IMAGE_NAME=${{ matrix.config.container }}" >> $GITHUB_ENV
            if [ "${{ github.event_name }}" = "pull_request" ]; then
                echo "APCI_GIT_URL=${{ github.event.pull_request.head.repo.clone_url }}" >> $GITHUB_ENV
                echo "APCI_BRANCH_NAME=${{ github.event.pull_request.head.ref }}" >> $GITHUB_ENV
            else
                echo "APCI_GIT_URL=https://github.com/${{ github.repository }}.git" >> $GITHUB_ENV
                echo "APCI_BRANCH_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            fi
            ${{ matrix.config.hwloc == 'no' }} && echo "APCI_HWLOC=OFF" >> $GITHUB_ENV || true
            ${{ matrix.config.sanitizer == 'asan' }}  && echo 'APCI_SANITIZER_ASAN=ON'  >> $GITHUB_ENV || true
            ${{ matrix.config.sanitizer == 'tsan' }}  && echo 'APCI_SANITIZER_TSAN=ON'  >> $GITHUB_ENV || true
            ${{ matrix.config.sanitizer == 'lsan' }}  && echo 'APCI_SANITIZER_LSAN=ON'  >> $GITHUB_ENV || true
            ${{ matrix.config.sanitizer == 'ubsan' }} && echo 'APCI_SANITIZER_UBSAN=ON' >> $GITHUB_ENV || true
            ${{ matrix.config.simd != '' }} && echo 'APCI_SIMD=${{matrix.config.simd}}'  >> $GITHUB_ENV || true

      - name: job configuration environment variables
        run: "${APCI_ALPAKA_ROOT}/script/ci/info.sh"

      # Install base dependencies
      - name: Install base dependencies
        run: |
          "${APCI_ALPAKA_ROOT}/script/ci/install/basic.sh"

      - name: Install CMake
        run: "${APCI_ALPAKA_ROOT}/script/ci/install/cmake.sh"

      - name: Install GCC
        run: "${APCI_ALPAKA_ROOT}/script/ci/install/gcc.sh"

      - name: Install Clang
        shell: bash
        if: matrix.config.compiler == 'clang' && matrix.config.hip == 'no'
        run: "${APCI_ALPAKA_ROOT}/script/ci/install/clang.sh"

      - name: Install CUDA
        if: matrix.config.cuda != 'no'
        shell: bash
        run: $APCI_ALPAKA_ROOT/script/ci/install/cuda.sh

      - name: Install ROCm
        if: matrix.config.hip != 'no'
        shell: bash
        run: "${APCI_ALPAKA_ROOT}/script/ci/install/rocm.sh"

      - name: Install oneAPI
        if: matrix.config.compiler == 'icpx'
        shell: bash
        run: "${APCI_ALPAKA_ROOT}/script/ci/install/oneapi.sh"

      - name: Install oneTBB
        if: matrix.config.tbb == 'on' && matrix.config.compiler != 'icpx'
        shell: bash
        run: "${APCI_ALPAKA_ROOT}/script/ci/install/tbb.sh"

      # hwloc (opt out)
      - name: Install hwloc
        if: matrix.config.hwloc != 'no'
        shell: bash
        run: "${APCI_ALPAKA_ROOT}/script/ci/install/hwloc.sh"

      - name: Setup Sanitizer
        if: matrix.config.sanitizer
        run: "${APCI_ALPAKA_ROOT}/script/ci/install/sanitizer.sh"

      # Configure CMake with the selected compiler and options
      - name: Configure CMake
        run: "${APCI_ALPAKA_ROOT}/script/ci/configure.sh"

      - name: Compile Code
        run: "${APCI_ALPAKA_ROOT}/script/ci/build.sh"

      - name: Run tests
        if: matrix.config.cuda == 'no' && matrix.config.hip == 'no'
        run: "${APCI_ALPAKA_ROOT}/script/ci/test.sh"

  # Check that all generated matrix jobs passed
  # This job allow us to add 'ci-jobmatrix' as required job in GitHub and never miss marking matrix jobs as
  # required check. This avoids that we merge broken PR's and is workarounding an issue of GitHub that
  # The names selectable as required jobs not match the names shown at the end of each PR.
  ci-jobmatrix:
    name: ci-jobmatrix
    runs-on: ubuntu-latest
    needs: [ci]
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "Matrix CI failed: ${{ needs.ci.result }}"
            exit 1
          fi

  # We use only a single gcc version to check the coverage.
  # Therefore, the results will be a ruf coverage overview.
  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 ninja-build gcovr libhwloc-dev pkg-config

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -Dalpaka_TESTS=ON \
            -Dalpaka_EXAMPLES=OFF \
            -Dalpaka_BENCHMARKS=OFF \
            -Dalpaka_DOCS=OFF \
            -Dalpaka_HEADERCHECKS=OFF \
            -DBUILD_TESTING=ON \
            -Dalpaka_DEP_HWLOC=ON \
            -Dalpaka_DEP_OMP=ON \
            -Dalpaka_COVERAGE=ON

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage report
        run: |
          gcovr \
            --root . \
            --filter 'include/' \
            --exclude 'test/' \
            --exclude 'example/' \
            --exclude 'benchmark/' \
            --cobertura-pretty \
            --output build/coverage.xml \
            build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/coverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: cpu
          name: cpu-coverage
          use_oidc: true
